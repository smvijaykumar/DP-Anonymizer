# Defaults for every environment. Environment files (config/*.conf) override these.
# This file never contains secrets: only where to find them.
anonymizer {
  job-version = "1.0.0-SNAPSHOT"
  job-version = ${?ANON_JOB_VERSION}

  # What to do with an input field that is not in schema.fields: dlq | fail
  unknown-field-policy = dlq

  # schema { ... }, classification { ... } and hierarchies { ... } have no defaults on purpose.

  crypto {
    # env | vault | aws-secrets-manager
    provider = env
    active-version = v1
    active-version = ${?ANON_HMAC_ACTIVE_VERSION}
    # Domain separation: tokens for one purpose cannot be matched against another's.
    token-context = "customer-token"
    env {
      prefix = "ANON_HMAC_KEY_"
      allow-system-properties = false
    }
    vault {
      address = ""
      address = ${?VAULT_ADDR}
      mount = "secret"
      path = "anonymizer/hmac"
      namespace = ""
      token-env = "VAULT_TOKEN"
      token-file = "/vault/secrets/token"
      timeout = 10s
    }
    aws {
      region = "us-east-1"
      region = ${?AWS_REGION}
      secret-id = "anonymizer/hmac"
    }
  }

  profile {
    source {
      # Either table (catalog table name) or format + path
      table = ""
      format = parquet
      path = ""
      options {}
    }
    output-path = ""
    k = 10
    l = 3
    suppression-limit = 0.02
    max-prosecutor-risk = 0.1
    max-average-risk = 0.05
    # STAR: keep suppressed customers with all quasi-identifiers as "*"; EXCLUDE: drop them
    suppressed-handling = STAR
    # Reuse the previous version's generalization levels while they still satisfy k and l
    pin-previous-levels = true
    # Duplicate customer ids in the snapshot: fail | first
    duplicate-policy = fail
  }

  stream {
    kafka {
      bootstrap-servers = ""
      topic = ""
      group-id = ""
      starting-offsets = earliest
      max-offsets-per-trigger = 50000000
      # Passed to the Kafka client with a "kafka." prefix; driver-only, never shipped to tasks
      options {}
    }
    # A Spark interval ("1 hour") or "available-now" (process everything, then stop)
    trigger = "1 hour"
    checkpoint-path = ""
    output-path = ""
    quarantine-path = ""
    dlq-topic = ""
    broadcast-profile = true
  }

  audit-path = ""

  output {
    compression = snappy
  }

  metrics {
    enabled = true
    port = 9095
  }
}
