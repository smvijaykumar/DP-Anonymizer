# Local development: docker-compose Kafka, local files, key from ANON_HMAC_KEY_V1.
include "common-schema.conf"

anonymizer {
  hierarchies.occupation.file = "config/occupation-categories.csv"

  crypto.provider = env

  profile {
    source { format = parquet, path = "file:///tmp/anonymizer/snapshot" }
    output-path = "file:///tmp/anonymizer/profile"
    k = 10
    l = 3
    duplicate-policy = first
  }

  stream {
    kafka {
      bootstrap-servers = "localhost:9092"
      topic = "customer-events"
      group-id = "anonymizer-local"
      starting-offsets = earliest
    }
    # Short interval for local iteration; use "1 hour" everywhere else
    trigger = "2 minutes"
    checkpoint-path = "file:///tmp/anonymizer/checkpoint"
    output-path = "file:///tmp/anonymizer/output"
    quarantine-path = "file:///tmp/anonymizer/quarantine"
    dlq-topic = "customer-events-dlq"
  }

  audit-path = "file:///tmp/anonymizer/audit"
  metrics.port = 9095
}
