# One-click demo (docker compose): Kafka in the compose network, all data on the /data volume.
include "common-schema.conf"

anonymizer {
  crypto.provider = env

  profile {
    source { format = parquet, path = "file:///data/snapshot" }
    output-path = "file:///data/profile"
    k = 10
    l = 3
  }

  stream {
    kafka {
      bootstrap-servers = "kafka:19092"
      topic = "customer-events"
      group-id = "anonymizer-demo"
      starting-offsets = earliest
    }
    # Short interval so the demo shows results quickly; production uses "1 hour"
    trigger = "15 seconds"
    trigger = ${?DEMO_TRIGGER}
    checkpoint-path = "file:///data/checkpoint"
    output-path = "file:///data/output"
    quarantine-path = "file:///data/quarantine"
    dlq-topic = "customer-events-dlq"
  }

  audit-path = "file:///data/audit"
  metrics.port = 9095
}
