# Production: inside the security boundary. Key from AWS Secrets Manager via IRSA, mTLS to Kafka.
include "common-schema.conf"

anonymizer {
  unknown-field-policy = dlq

  crypto {
    provider = aws-secrets-manager
    aws.secret-id = "data-privacy/anonymizer/prod/hmac"
  }

  profile {
    source { table = "customer.customer_demographics_snapshot" }
    output-path = "s3a://example-anon-prod/profile"
    k = 10
    l = 3
    suppression-limit = 0.02
    max-prosecutor-risk = 0.1
    max-average-risk = 0.05
    suppressed-handling = STAR
    pin-previous-levels = true
    duplicate-policy = fail
  }

  stream {
    kafka {
      bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
      topic = "customer-events"
      group-id = "anonymizer-prod"
      max-offsets-per-trigger = 50000000
      options {
        "security.protocol" = "SSL"
        "ssl.keystore.type" = "PKCS12"
        "ssl.keystore.location" = "/etc/kafka/tls/client.p12"
        "ssl.keystore.password" = ${?KAFKA_KEYSTORE_PASSWORD}
        "ssl.truststore.type" = "PKCS12"
        "ssl.truststore.location" = "/etc/kafka/tls/truststore.p12"
        "ssl.truststore.password" = ${?KAFKA_TRUSTSTORE_PASSWORD}
      }
    }
    trigger = "1 hour"
    checkpoint-path = "s3a://example-anon-prod/checkpoints/hourly-stream"
    output-path = "s3a://example-anon-prod/output/customer_events"
    quarantine-path = "s3a://example-anon-prod/quarantine/customer_events"
    dlq-topic = "customer-events-dlq"
    broadcast-profile = true
  }

  audit-path = "s3a://example-anon-prod/audit"
  metrics.port = 9095
}
