# Shared by every environment. Replace the sample fields with your real schema.
# Every input field must appear in exactly one classification list; the jobs refuse to start otherwise.
anonymizer {
  schema {
    id-field = customerId
    fields = [
      { name = customerId, type = string }
      { name = firstName,  type = string }
      { name = lastName,   type = string }
      { name = email,      type = string }
      { name = phone,      type = string }
      { name = dob,        type = date }
      { name = gender,     type = string }
      { name = zip,        type = string }
      { name = occupation, type = string }
      { name = incomeBand, type = string }
      { name = eventType,  type = string }
      { name = eventTs,    type = timestamp }
    ]
  }

  classification {
    DIRECT_IDENTIFIER = [customerId, firstName, lastName, email, phone]   # customerId -> HMAC token; rest dropped
    QUASI_IDENTIFIER  = [dob, gender, zip, occupation]                     # generalized by ARX
    SENSITIVE         = [incomeBand]                                       # l-diversity
    INSENSITIVE       = [eventType, eventTs]                               # passed through
  }

  hierarchies {
    dob        { type = birth-year-bands, widths = [5, 10, 20] }
    zip        { type = zip-mask, keep-digits = [5, 3] }
    occupation { type = category-map, file = "/opt/anonymizer/config/occupation-categories.csv", unmapped-category = OTHER }
    gender     { type = value-star }
  }
}
