# Shared dev cluster: SASL_SSL Kafka, Vault (Agent sidecar) for the HMAC key, S3 storage.
include "common-schema.conf"

anonymizer {
  crypto {
    provider = vault
    vault {
      mount = "secret"
      path = "data-privacy/anonymizer/dev/hmac"
    }
  }

  profile {
    source { table = "customer_dev.customer_demographics_snapshot" }
    output-path = "s3a://example-anon-dev/profile"
    k = 10
    l = 3
  }

  stream {
    kafka {
      bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
      topic = "customer-events"
      group-id = "anonymizer-dev"
      options {
        "security.protocol" = "SASL_SSL"
        "sasl.mechanism" = "SCRAM-SHA-512"
        "sasl.jaas.config" = ${?KAFKA_SASL_JAAS_CONFIG}
        "ssl.truststore.location" = "/etc/kafka/truststore.jks"
        "ssl.truststore.password" = ${?KAFKA_TRUSTSTORE_PASSWORD}
      }
    }
    trigger = "1 hour"
    checkpoint-path = "s3a://example-anon-dev/checkpoints/hourly-stream"
    output-path = "s3a://example-anon-dev/output/customer_events"
    quarantine-path = "s3a://example-anon-dev/quarantine/customer_events"
    dlq-topic = "customer-events-dlq"
  }

  audit-path = "s3a://example-anon-dev/audit"
}
