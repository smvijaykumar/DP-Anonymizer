# Requires the Kubeflow Spark Operator (sparkoperator.k8s.io/v1beta2)
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: anonymizer-hourly-stream
  namespace: data-privacy
spec:
  type: Java
  mode: cluster
  image: registry.example.com/data-privacy/customer-anonymizer:1.0.0
  imagePullPolicy: IfNotPresent
  mainClass: com.example.anonymizer.stream.StreamJob
  mainApplicationFile: local:///opt/anonymizer/jars/anonymizer-stream-job.jar
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Always
    onFailureRetryInterval: 60
    onSubmissionFailureRetryInterval: 60
  sparkConf:
    spark.sql.session.timeZone: "UTC"
    spark.sql.shuffle.partitions: "64"
    spark.sql.streaming.metricsEnabled: "true"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    spark.driver.extraJavaOptions: "-Dconfig.file=/opt/anonymizer/config/prod.conf -Dlogback.configurationFile=/opt/spark/conf/logback.xml"
    spark.executor.extraJavaOptions: "-Dlogback.configurationFile=/opt/spark/conf/logback.xml"
  driver:
    cores: 1
    memory: "6g"
    serviceAccount: anonymizer
    labels:
      app: anonymizer-hourly-stream
      app.kubernetes.io/part-of: customer-anonymizer
    ports:
      - name: metrics
        containerPort: 9095
        protocol: TCP
    envFrom:
      - secretRef:
          name: anonymizer-kafka-credentials   # KAFKA_BOOTSTRAP_SERVERS, KAFKA_*_PASSWORD
    env:
      - name: ANON_JOB_VERSION
        value: "1.0.0"
    secrets:
      - name: anonymizer-kafka-tls
        path: /etc/kafka/tls
        secretType: Generic
  executor:
    instances: 4
    cores: 2
    memory: "8g"
    serviceAccount: anonymizer
    labels:
      app.kubernetes.io/part-of: customer-anonymizer
    # Executors tokenize, so they need the key provider (IRSA here) but not the Kafka password env.
---
apiVersion: v1
kind: Service
metadata:
  name: anonymizer-hourly-stream-metrics
  namespace: data-privacy
  labels:
    app: anonymizer-hourly-stream
spec:
  selector:
    app: anonymizer-hourly-stream
    spark-role: driver
  ports:
    - name: metrics
      port: 9095
      targetPort: 9095
# With the Prometheus Operator, add a ServiceMonitor selecting app=anonymizer-hourly-stream, port "metrics".
